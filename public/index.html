<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07140f" />
    <title>PR — Personal Brand Intelligence</title>
    <style>
      :root { color-scheme: dark; font-family: Tahoma, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eaf8f0; background: radial-gradient(circle at 80% 10%, #174c36 0, transparent 34%), #07140f; }
      main { width: min(900px, calc(100% - 32px)); padding: 72px 0; }
      .eyebrow { color: #75d7a5; letter-spacing: .12em; font-size: 13px; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 20px 0; font-size: clamp(40px, 8vw, 78px); line-height: 1.08; letter-spacing: -.04em; }
      p { max-width: 690px; color: #b7cfc2; font-size: clamp(17px, 2.4vw, 22px); line-height: 1.9; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 11px 16px; color: #bff2d5; border: 1px solid #2a6849; border-radius: 999px; background: #0d251a; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #55e89a; box-shadow: 0 0 18px #55e89a; }
      footer { margin-top: 72px; color: #6f9180; font-size: 13px; direction: ltr; text-align: right; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Personal Brand &amp; PR Operating System</div>
      <h1>اعتبار، روایت و حرکت بعدی؛ مبتنی بر شناخت واقعی انسان.</h1>
      <p>
        PR یک تولیدکننده محتوای عمومی نیست. این سیستم برای ساخت حافظه شخصی
        قابل‌اعتماد، تصمیم‌سازی توضیح‌پذیر و حفاظت از هویت و اعتبار طراحی می‌شود.
      </p>
      <div class="status"><span class="dot"></span>مرحله Foundation فعال است</div>
      <footer>pr.wealthos.ir · Foundation Preview</footer>
    </main>
  </body>
</html>
